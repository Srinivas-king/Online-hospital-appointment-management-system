<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Access - Sentini Hospital</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body style="min-height: 100vh; background: var(--bg-main);">
    <div class="container">
        <header>
            <a href="index.html" style="text-decoration: none;">
                <div class="logo-section">
                    <div class="logo-plus">+</div>
                    <h2 style="font-weight: 800; color: var(--text-main);">Sentini Health</h2>
                </div>
            </a>
            <div class="nav-right" style="display: flex; align-items: center; gap: 1rem;">
                <a href="patient-login.html" id="headerPatientLogin"
                    style="color: var(--primary-blue); text-decoration: none; font-size: var(--fs-xs); font-weight: 700; background: rgba(59, 130, 246, 0.1); padding: 0.5rem 1rem; border-radius: 8px;">Patient
                    Login</a>
                <a href="admin-login.html"
                    style="color: var(--text-sub); text-decoration: none; font-size: var(--fs-xs); font-weight: 600;">Admin
                    Access</a>
            </div>
        </header>

        <div class="auth-wrapper">
            <div class="auth-container" style="margin: 0; border-top: 5px solid var(--primary-blue);">
                <div class="text-center" style="margin-bottom: 2.5rem;">
                    <div class="logo-plus" style="margin: 0 auto 1.5rem;">+</div>
                    <h2>Staff Portal</h2>
                    <p style="color: var(--text-sub); margin-top: 0.5rem; font-weight: 500;">Secure access for hospital
                        personnel</p>
                </div>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label>Admin Email</label>
                        <input type="email" id="admEmail" placeholder="admin@sentini.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="admPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-full mt-1">Authorize Login</button>
                </form>
                <p class="text-center mt-2" style="font-size: var(--fs-xs); color: var(--text-sub); font-weight: 500;">
                    Unauthorized access is strictly prohibited and monitored.
                </p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (App.isAuthenticated()) {
                const headerLogin = document.getElementById('headerPatientLogin');
                if (headerLogin) headerLogin.style.display = 'none';
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                email: document.getElementById('admEmail').value,
                password: document.getElementById('admPassword').value
            };

            const resp = await fetch(`${App.getApiUrl()}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (resp.ok) {
                const data = await resp.json();
                if (data.user.role !== 'admin') {
                    App.notify('Access denied. Admin role required.', 'error');
                    return;
                }
                App.saveAuth(data.token, data.user);
                App.notify('Staff authentication successful.', 'success');
                setTimeout(() => window.location.href = 'admin.html', 1000);
            } else {
                const data = await resp.json();
                App.notify(data.message || 'Login failed', 'error');
            }
        });
    </script>
</body>

</html>
